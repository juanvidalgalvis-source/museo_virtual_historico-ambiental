<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museo Virtual · La Fragilidad Ambiental de la Cultura</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#f3ead7}
  canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:auto;display:block}
  #title{position:fixed;top:22px;left:50%;transform:translateX(-50%);padding:8px 26px;background:rgba(20,16,12,.72);border:1px solid #b8975a;letter-spacing:.12em;font-size:clamp(13px,2vw,20px);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
  #prompt{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);padding:10px 22px;background:rgba(20,16,12,.8);border:1px solid #d9b56a;color:#f7e3a8;font-family:'Courier New',monospace;font-weight:bold;letter-spacing:.08em;font-size:clamp(12px,1.8vw,18px);opacity:0;transition:opacity .2s;pointer-events:none}
  #fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .45s;pointer-events:none}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,12,9,.88);text-align:center;cursor:pointer}
  #intro h1{font-weight:normal;letter-spacing:.2em;font-size:clamp(20px,4vw,40px);margin:0 0 6px}
  #intro p{margin:6px 0;color:#cdbb95;font-size:clamp(12px,1.8vw,17px)}
  #intro .go{margin-top:22px;border:1px solid #b8975a;padding:10px 26px;color:#f7e3a8;letter-spacing:.15em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"></div>
<div id="prompt">[PRESIONA E / CLIC PARA ENTRAR]</div>
<div id="fade"></div>
<div id="intro">
  <h1>LA FRAGILIDAD AMBIENTAL DE LA CULTURA</h1>
  <p>Museo virtual · Augusto Ángel Maya</p>
  <p>W A S D / ↑ ↓ mover &nbsp;·&nbsp; ← → o mouse girar &nbsp;·&nbsp; E o clic para entrar &nbsp;·&nbsp; Esc libera el mouse</p>
  <div class="go">HAZ CLIC PARA COMENZAR</div>
</div>
<script>
const NAMES=["Salida","El Lejano Paleolítico","Del Homo Sapiens al Neolítico","El Cercano Neolítico","Los Imperios Agrarios","Grecia y los Estados Comerciales","Roma y los Imperios Comerciales","El Medioevo y el Descanso del Saqueo","La Época de los Renacimientos","Límites Ambientales del Crecimiento Europeo","La Expansión Inevitable de Europa","Recuperación de Europa y Capitalismo Industrial","El Dominio Colonial","Medio Ambiente en el Régimen Socialista","Otras Experiencias Socialistas","Consecuencias Ambientales del Desarrollo Moderno","Sala Especial"];
const OPEN=new Set([5,6,7,16]);
const label=i=>i===0?"SALIDA":i===16?"Sala especial":`Capítulo ${i} · ${NAMES[i]}`;

// ---------- Texturas procedurales ----------
const T=128;
function mk(fn){const c=document.createElement('canvas');c.width=c.height=T;fn(c.getContext('2d'));return c}
const wallTex=mk(g=>{g.fillStyle='#f1eee8';g.fillRect(0,0,T,T);
  for(let i=0;i<300;i++){g.fillStyle=`rgba(120,110,95,${Math.random()*.04})`;g.fillRect(Math.random()*T,Math.random()*T,2,2)}
  g.fillStyle='#d8d3c8';g.fillRect(0,T-14,T,14);g.fillStyle='#b9b2a3';g.fillRect(0,T-15,T,1)});
function doorTex(i){return mk(g=>{
  const open=OPEN.has(i);
  g.fillStyle='#f1eee8';g.fillRect(0,0,T,T);
  g.fillStyle='#2a1a10';g.fillRect(8,6,112,T-6);            // marco de madera
  g.fillStyle='#3a2415';g.fillRect(14,12,100,T-12);
  for(let x=14;x<114;x+=20){g.fillStyle='#2b1a0f';g.fillRect(x+19,12,1.5,T-12);
    g.fillStyle='rgba(255,220,170,.05)';g.fillRect(x+3,12,2,T-12)}
  g.strokeStyle='#4a4a4e';g.lineWidth=5;g.strokeRect(9,7,110,T-7);   // marco de hierro
  g.fillStyle='#4a4a4e';
  [40,80].forEach(y=>g.fillRect(14,y,100,7));                 // bandas de hierro
  g.fillStyle='#8a8a90';
  for(let x=22;x<112;x+=22)[43,83].forEach(y=>{g.beginPath();g.arc(x,y,2,0,7);g.fill()});
  g.fillStyle='#8a8a90';g.fillRect(96,62,5,14);                // manija
  // placa con número
  g.fillStyle=i===0?'#3d6b3d':'#b8975a';g.fillRect(40,18,48,16);
  g.fillStyle='#1a120a';g.font='bold 13px Georgia';g.textAlign='center';
  g.fillText(i===0?'SALIDA':String(i),64,31);
  if(!open&&i!==0){g.fillStyle='#4a4a4e';g.fillRect(14,58,100,4)} // sellada
  if(open||i===0){const gr=g.createLinearGradient(0,T-30,0,T);      // luz en el umbral
    gr.addColorStop(0,'rgba(255,214,130,0)');gr.addColorStop(1,i===0?'rgba(150,255,170,.75)':'rgba(255,225,150,.95)');
    g.fillStyle=gr;g.fillRect(14,T-30,100,30)}
})}
const TEX={1:wallTex};for(let i=0;i<=16;i++)TEX[100+i]=doorTex(i);

// ---------- Mapas ----------
function buildCorridor(){
  const W=42,H=7,m=[];for(let y=0;y<H;y++){m.push(Array(W).fill(y===0||y===H-1?1:0));m[y][0]=1;m[y][W-1]=1}
  m[3][0]=100;const doors=[{i:0,x:0,y:3,fx:1.5,fy:3.5}];
  for(let i=1;i<=16;i++){const x=6+4*((i-1)>>1),n=i%2===1,y=n?0:H-1;
    m[y][x]=100+i;doors.push({i,x,y,fx:x+.5,fy:n?1.5:H-1.5})}
  return{m,W,H,doors,sx:2.5,sy:3.5,sa:0}
}
function buildRoom(){const S=13,m=[];
  for(let y=0;y<S;y++){m.push([]);for(let x=0;x<S;x++)m[y].push(x===0||y===0||x===S-1||y===S-1?1:0)}
  m[S-1][6]=100;return{m,W:S,H:S,doors:[{i:0,x:6,y:S-1,fx:6.5,fy:S-1.5}],sx:6.5,sy:S-3.5,sa:-Math.PI/2}}

const corridor=buildCorridor();
let cur=corridor,roomIdx=-1,ret=null;
const P={x:corridor.sx,y:corridor.sy,a:0};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=Math.max(320,innerWidth*.6|0);H=Math.max(180,innerHeight*.6|0);canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();

// ---------- Entrada ----------
const keys={};let locked=false,transitioning=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')tryEnter();if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;
  document.getElementById('intro').style.display=locked?'none':'flex'});
document.getElementById('intro').addEventListener('click',()=>canvas.requestPointerLock());
canvas.addEventListener('click',()=>{if(locked)tryEnter()});
document.addEventListener('mousemove',e=>{if(locked)P.a+=e.movementX*.0025});

// ---------- Interacción con puertas ----------
let target=null;
function findTarget(){target=null;let best=1e9;
  const dx=Math.cos(P.a),dy=Math.sin(P.a);
  for(const d of cur.doors){const vx=d.x+.5-P.x,vy=d.y+.5-P.y,dist=Math.hypot(vx,vy);
    if(dist<2.6&&(vx*dx+vy*dy)/dist>.75&&dist<best){best=dist;target=d}}
  const t=document.getElementById('title'),p=document.getElementById('prompt');
  const can=target&&(cur!==corridor||OPEN.has(target.i)||target.i===0);
  if(cur===corridor){t.textContent=target?label(target.i):'';t.style.opacity=target?1:0}
  p.style.opacity=can?1:0;
  p.textContent=target&&target.i===0&&cur===corridor?'[PRESIONA E / CLIC PARA SALIR]':(target&&target.i===0?'[PRESIONA E / CLIC PARA VOLVER AL PASILLO]':'[PRESIONA E / CLIC PARA ENTRAR]');
  return can}
function tryEnter(){if(transitioning||!locked||!findTarget())return;
  const i=target.i,f=document.getElementById('fade');transitioning=true;f.style.opacity=1;
  setTimeout(()=>{
    if(cur===corridor){
      if(i===0){alert('Has llegado a la salida del museo. ¡Gracias por la visita!');const d=corridor.doors[0];P.x=d.fx;P.y=d.fy;P.a=0}
      else{ret={x:target.fx,y:target.fy,a:target.y===0?Math.PI/2:-Math.PI/2};
        cur=buildRoom();roomIdx=i;P.x=cur.sx;P.y=cur.sy;P.a=cur.sa;
        const t=document.getElementById('title');t.textContent=label(i);t.style.opacity=1}
    }else{cur=corridor;roomIdx=-1;P.x=ret.x;P.y=ret.y;P.a=ret.a;document.getElementById('title').style.opacity=0}
    f.style.opacity=0;setTimeout(()=>transitioning=false,450)},480)}

// ---------- Movimiento ----------
const solid=(x,y)=>{const c=cur.m[y|0]?.[x|0];return c!==0};
function move(dx,dy){const r=.25;
  if(!solid(P.x+dx+Math.sign(dx)*r,P.y-r)&&!solid(P.x+dx+Math.sign(dx)*r,P.y+r))P.x+=dx;
  if(!solid(P.x-r,P.y+dy+Math.sign(dy)*r)&&!solid(P.x+r,P.y+dy+Math.sign(dy)*r))P.y+=dy}
function update(dt){
  if(keys.ArrowLeft)P.a-=2*dt;if(keys.ArrowRight)P.a+=2*dt;
  const c=Math.cos(P.a),s=Math.sin(P.a),v=3.2*dt;let fx=0,fy=0;
  if(keys.KeyW||keys.ArrowUp){fx+=c;fy+=s}if(keys.KeyS||keys.ArrowDown){fx-=c;fy-=s}
  if(keys.KeyD){fx-=s;fy+=c}if(keys.KeyA){fx+=s;fy-=c}
  const l=Math.hypot(fx,fy);if(l)move(fx/l*v,fy/l*v)}

// ---------- Render (raycasting) ----------
function render(){
  const cg=ctx.createLinearGradient(0,0,0,H/2);cg.addColorStop(0,'#e9e4da');cg.addColorStop(1,'#cfc9bd');
  ctx.fillStyle=cg;ctx.fillRect(0,0,W,H/2);
  const fg=ctx.createLinearGradient(0,H/2,0,H);fg.addColorStop(0,'#3a3a3d');fg.addColorStop(1,'#232326');
  ctx.fillStyle=fg;ctx.fillRect(0,H/2,W,H/2);
  const dx=Math.cos(P.a),dy=Math.sin(P.a),pl=.5*W/H,px=-dy*pl,py=dx*pl,m=cur.m;
  for(let x=0;x<W;x++){
    const cx=2*x/W-1,rx=dx+px*cx,ry=dy+py*cx;
    let mx=P.x|0,my=P.y|0;const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);
    let sx,sy,sdx,sdy;
    if(rx<0){sx=-1;sdx=(P.x-mx)*ddx}else{sx=1;sdx=(mx+1-P.x)*ddx}
    if(ry<0){sy=-1;sdy=(P.y-my)*ddy}else{sy=1;sdy=(my+1-P.y)*ddy}
    let side=0,hit=0;
    while(!hit){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
      const c=m[my]?.[mx];if(c===undefined){hit=1}else if(c)hit=c}
    const perp=Math.max(.05,side===0?sdx-ddx:sdy-ddy);
    let wx=side===0?P.y+perp*ry:P.x+perp*rx;wx-=Math.floor(wx);
    let tx=(wx*T)|0;if((side===0&&rx>0)||(side===1&&ry<0))tx=T-1-tx;
    const h=H/perp,top=(H-h)/2,tex=TEX[hit]||wallTex;
    ctx.drawImage(tex,tx,0,1,T,x,top,1,h);
    const a=Math.min(.7,perp/18*.65+(side?.14:0));
    ctx.fillStyle=`rgba(25,22,20,${a})`;ctx.fillRect(x,top,1,h);
  }
}
let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(locked&&!transitioning)update(dt);findTarget();render();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
